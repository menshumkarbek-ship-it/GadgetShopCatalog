services:
  # 💾 PostgreSQL Relational Database Service
  db:
    image: postgres:15-alpine
    container_name: mobile_shop_postgres
    restart: always
    environment:
      - POSTGRES_DB=mobile_shop_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🐍 Django storefront
  web:
    build: .
    container_name: mobile_shop_web
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=local-development-only
      - ALLOWED_HOSTS=localhost,127.0.0.1
      # Deliberately not DATABASE_URL: settings parses that with
      # ssl_require=True for the managed database in production, which a plain
      # local Postgres container does not speak.
      - DB_HOST=db
      - DB_NAME=mobile_shop_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
