{% load i18n %}
{# Footer Legal Block: canvas gray, 12px copy at #707070, links in #0066cc. #}
<footer class="band-gray">
    <div class="wrap py-10">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
            <p class="t-micro text-midgray">&copy; {% now "Y" %} {{ store_name }}. {% translate "All rights reserved." %}</p>
            <nav class="flex items-center gap-5 t-micro">
                <a href="{% url 'shop:about_us' %}" class="text-linkblue hover:underline">{% translate "About Us" %}</a>
                <a href="{% url 'shop:contact_us' %}" class="text-linkblue hover:underline">{% translate "Contact" %}</a>
            </nav>
        </div>
    </div>
</footer>
